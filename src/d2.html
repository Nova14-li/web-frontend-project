<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>难点 2 · return 之后回到调用点的下一行</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/d2.css">
</head>
<body>
  <header class="topbar">
    <span class="brand">递归与调用栈</span>
    <span class="tag">难点 2 / 3 · 返回地址与回溯</span>
  </header>

  <main class="wrap">
    <div class="page-head">
      <div>
        <h1 id="title" class="page-title"></h1>
        <p id="summary" class="page-summary"></p>
      </div>
      <!-- 计分条：连对与本题已错，跨步骤累计 -->
      <div class="scoreboard">
        <span id="streak" class="score score-good"></span>
        <span id="wrong" class="score score-bad"></span>
      </div>
    </div>

    <!-- 解说条：程序每走一步换一句，出题时提示「先作答」 -->
    <p id="narration" class="narration" aria-live="polite"></p>

    <!-- 三栏：代码（返回地址指向这里）/ 调用栈 / 组装台（只画一条式子） -->
    <section id="stage" class="stage">
      <!-- 返回地址连线：绝对定位盖在三栏之上，不参与布局，也不拦截鼠标 -->
      <svg id="back-lines" class="back-lines" aria-hidden="true"></svg>

      <div class="panel">
        <div class="panel-head">代码<span class="code-hint" id="code-hint"></span></div>
        <ol id="code" class="code"></ol>
      </div>

      <!-- 栈帧卡片：每张卡上单列一行返回地址，等待中的帧会拉一条线到代码 -->
      <div class="panel">
        <div class="panel-head">调用栈<span id="depth"></span></div>
        <ul id="stack" class="stack"></ul>
      </div>

      <div class="panel">
        <div class="panel-head">组装台<span class="code-hint" id="asm-hint"></span></div>
        <div id="assembly" class="assembly"></div>
      </div>
    </section>

    <!-- 判定区：程序停在 return 点时才出现，答对后收起 -->
    <section id="quiz" class="quiz" hidden aria-live="polite">
      <div class="quiz-head">
        <span id="quiz-topic" class="quiz-topic"></span>
        <span id="quiz-copy" class="quiz-copy"></span>
      </div>
      <div id="options" class="options" role="radiogroup" aria-label="返回值回到哪一处"></div>
      <div class="quiz-actions">
        <button type="button" id="confirm" class="btn-primary">确认</button>
        <span id="quiz-feedback" class="feedback"></span>
      </div>
    </section>

    <!-- 控件栏：没有「播放 / 单步前进」——按下开始后程序自己往下跑，到 return 点停下来等你。
         「开始演示」只在还没开始时出现（初始 hidden，由 JS 填文案后放开）。 -->
    <div class="controls">
      <button type="button" id="start-btn" class="btn-primary" hidden></button>
      <button type="button" id="restart-btn" class="ghost">重新开始</button>
      <button type="button" id="back-btn" class="ghost">回到上一题</button>
      <button type="button" id="replay-btn" class="ghost">回放回溯路径</button>
      <span id="counter" class="counter"></span>
      <!-- 运行指示：只在程序自己往下跑时亮，停住等人作答时熄灭 -->
      <span id="run-flag" class="run-flag" hidden></span>
      <label class="param">
        <span id="param-label"></span>
        <input id="param-input" type="number" inputmode="numeric">
      </label>
      <label class="param switch">
        <input id="hint-toggle" type="checkbox" checked>
        <span id="hint-label"></span>
      </label>
    </div>

    <p id="hint" class="hint"></p>
    <p id="status" class="status" role="alert"></p>

    <!-- 回溯路径：点按钮才展开，折线段依次点亮 -->
    <section id="replay-panel" class="panel replay" hidden>
      <div class="panel-head">回溯路径<span class="code-hint" id="replay-hint"></span></div>
      <div class="replay-body" id="replay-body"></div>
    </section>
  </main>

  <!-- 返回值飞行用的浮层：不参与布局，也不拦截鼠标 -->
  <div id="fly-layer" class="fly-layer" aria-hidden="true"></div>

  <script src="js/common.js"></script>
  <script src="js/d2.js"></script>
</body>
</html>
